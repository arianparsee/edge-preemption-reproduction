[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-reproduction"
version = "0.1.0"
description = "Reproduction of arXiv:2403.15665v2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "pillow==12.3.0",
    "pyeasyga==0.3.1",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
