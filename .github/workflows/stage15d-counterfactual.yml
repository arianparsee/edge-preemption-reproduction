name: Stage 15-D single-factor DK counterfactuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/stage15d-dispatch

permissions:
  contents: read

concurrency:
  group: stage15d-counterfactual
  cancel-in-progress: false

jobs:
  counterfactual-pair:
    name: ${{ matrix.variant }} / ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant:
          - fixed_penalty
          - initial_population_repair
          - offspring_repair
        policy:
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      WORKLOAD_SEED: "541501192080118187"

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -e .[dev]

      - name: Verify fixed-shape RNG and Stage 15-D contracts
        run: >-
          python -m pytest -q
          tests/unit/test_stage15d_counterfactual_selector.py
          tests/unit/test_stage15d_runner.py
          tests/unit/test_stage15d_merge.py
          tests/unit/test_stage15d_workflow_security.py

      - name: Run two exact replays of one auxiliary pair
        shell: bash
        run: >-
          python scripts/run_stage15d_counterfactual.py
          --config configs/experiments/pipe_normal_full_stage13f.json
          --baseline-fingerprints tests/fixtures/stage15b_baseline_fingerprints.json
          --baseline-rng tests/fixtures/stage15d_stage15c_rng_guard.json
          --policy "${{ matrix.policy }}"
          --variant "${{ matrix.variant }}"
          --output "stage15d-${{ matrix.variant }}-${{ matrix.policy }}.json"

      - name: Reject sensitive, raw or scientifically invalid output
        shell: bash
        run: |
          python - "stage15d-${{ matrix.variant }}-${{ matrix.policy }}.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          encoded = text.lower()
          data = json.loads(text)
          forbidden = (
              "job-", "arrival_raw_draws", "workload.json", "result.json",
              str(Path.home()).lower(), str(Path.cwd()).lower(),
              "github_token", "github_pat_", "secret", ".env",
              "chromosome_bits\": true", "task_identifiers_in_artifact\": true",
              "raw_workload_in_artifact\": true", "raw_trace_in_artifact\": true",
          )
          if any(token in encoded for token in forbidden):
              raise ValueError("Stage 15-D artifact contains a forbidden public field")
          if data["baseline_recomputed"] or not data["replay_exact"]:
              raise ValueError("baseline reuse or replay invariant failed")
          if not data["rng_gate"]["passed"]:
              raise ValueError("RNG gate failed")
          if data["workload_seed"] != int(541501192080118187):
              raise ValueError("unexpected workload seed")
          if data["official_algorithm_changed"] or data["figure_6_overwritten"]:
              raise ValueError("official-result boundary failed")
          if data["thirty_workloads_executed"]:
              raise ValueError("Stage 15-D must remain single-seed")
          if path.stat().st_size > 5_000_000:
              raise ValueError("Stage 15-D pair artifact unexpectedly large")
          PY

      - name: Upload independent sanitized pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15d-${{ matrix.variant }}-${{ matrix.policy }}-${{ github.run_id }}
          path: stage15d-${{ matrix.variant }}-${{ matrix.policy }}.json
          if-no-files-found: error
          retention-days: 7

  summarize:
    name: Validate and merge six auxiliary pairs
    if: always()
    needs: counterfactual-pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download all successful pair artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15d-*-${{ github.run_id }}
          path: stage15d-input
          merge-multiple: true

      - name: Require 6/6 pairs and merge sanitized summaries
        shell: bash
        run: |
          mapfile -t files < <(find stage15d-input -maxdepth 1 -type f -name '*.json' -print | sort)
          if [ "${#files[@]}" -ne 6 ]; then
            echo "Expected six independent pair artifacts; found ${#files[@]}" >&2
            exit 1
          fi
          args=()
          for file in "${files[@]}"; do
            args+=(--input "$file")
          done
          python scripts/merge_stage15d_counterfactuals.py \
            "${args[@]}" \
            --output stage15d-summary.json \
            --csv stage15d-comparison.csv

      - name: Record SHA-256 inventory
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = [Path("stage15d-summary.json"), Path("stage15d-comparison.csv")]
          inventory = {
              "schema_version": "stage15d-artifact-inventory-v1",
              "files": [
                  {
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in files
              ],
          }
          Path("stage15d-inventory.json").write_text(
              json.dumps(inventory, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Write non-sensitive job summary
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          rows = list(csv.DictReader(Path("stage15d-comparison.csv").open(encoding="utf-8")))
          lines = [
              "## Stage 15-D auxiliary counterfactuals",
              "",
              "- Validated pairs: **6/6**",
              "- Exact same-seed replays: **passed**",
              "- RNG gates: **passed**",
              "- Stage-15C baseline recomputed: **no**",
              "- Raw trace, task IDs or chromosomes uploaded: **no**",
              "",
              "| Variant | Policy | Completed | Utility | R1 guard | R2 guard |",
              "|---|---|---:|---:|---:|---:|",
          ]
          for row in rows:
              lines.append(
                  f"| {row['variant']} | {row['policy']} | {row['completed_jobs']} | "
                  f"{row['completed_utility']} | {row['round_1_final_guard_repairs']} | "
                  f"{row['round_2_final_guard_repairs']} |"
              )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload merged limited-retention report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15d-merged-counterfactual-${{ github.run_id }}
          path: |
            stage15d-summary.json
            stage15d-comparison.csv
            stage15d-inventory.json
          if-no-files-found: error
          retention-days: 7
