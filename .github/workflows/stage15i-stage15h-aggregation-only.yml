name: Stage 15-I Stage 15-H aggregation-only recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type STAGE15I-AGGREGATION-ONLY-APPROVED"
        required: true
        default: "STAGE15I-AGGREGATION-ONLY-APPROVED"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: stage15i-stage15h-aggregation-only
  cancel-in-progress: false

jobs:
  aggregate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SOURCE_STAGE15H_RUN_ID: "32474360245"
      SOURCE_STAGE13J_RUN_ID: "31644121025"
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Enforce aggregation-only dispatch gate
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "STAGE15I-AGGREGATION-ONLY-APPROVED"
      - name: Install pinned project dependencies
        run: python -m pip install -e .[dev]
      - name: Download all 100 successful Stage 15-H pair artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_github_run_artifacts.py
          --repository arianparsee/edge-preemption-reproduction
          --run-id "$SOURCE_STAGE15H_RUN_ID"
          --name-prefix stage15h-pair-
          --name-suffix "-$SOURCE_STAGE15H_RUN_ID"
          --output current-pairs
          --report current-pairs-download-report.json
      - name: Download the validated 20-pair reuse bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_github_run_artifacts.py
          --repository arianparsee/edge-preemption-reproduction
          --run-id "$SOURCE_STAGE15H_RUN_ID"
          --exact-name "stage15h-validated-reuse-$SOURCE_STAGE15H_RUN_ID"
          --expected-archive-sha256 4c84c1a479f5fdc6d89c4c573e9a6d690d299cec5d473771bb9ab9a9af6bd4b6
          --output reuse-bundle
          --report reuse-bundle-download-report.json
      - name: Download pinned Stage 13-J aggregate baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: arianparsee/edge-preemption-reproduction
          run-id: "31644121025"
          pattern: stage13j-final-120-pair-figure6-31644121025
          path: baseline-aggregate
      - name: Resolve the exact downloaded baseline metrics file
        id: baseline_metrics
        shell: bash
        run: |
          mapfile -t metrics < <(find baseline-aggregate -type f -name raw_run_metrics.csv -print)
          test "${#metrics[@]}" -eq 1
          echo "path=${metrics[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify aggregation-only input cardinality
        shell: bash
        run: |
          test "$(find current-pairs -type f -name 'stage15h-*.json' | wc -l)" -eq 100
          test "$(find "reuse-bundle/stage15h-validated-reuse-$SOURCE_STAGE15H_RUN_ID/prior" -type f -name 'reuse-*.json' | wc -l)" -eq 20
      - name: Validate and aggregate existing results only
        run: >-
          python scripts/finalize_stage15h_validation.py
          --new-root current-pairs
          --prior-root "reuse-bundle/stage15h-validated-reuse-$SOURCE_STAGE15H_RUN_ID/prior"
          --repair-manifest configs/experiments/stage15h_repair_reuse_manifest.json
          --baseline-manifest configs/experiments/stage15h_baseline_reuse_manifest.json
          --baseline-metrics "${{ steps.baseline_metrics.outputs.path }}"
          --baseline-lifecycle results/aggregated/stage15a/per_run_lifecycle.csv
          --output stage15h-final
      - name: Validate final completeness and preserve download audits
        shell: bash
        run: |
          python -c "import json; p=json.load(open('stage15h-final/completeness_report.json')); assert p['status']=='complete_and_valid' and p['repair_pairs']==120 and p['baseline_pairs']==120 and p['baseline_recomputed'] is False"
          cp current-pairs-download-report.json stage15h-final/
          cp reuse-bundle-download-report.json stage15h-final/
          printf '%s\n' \
            'classification=[آزمون کمکی]' \
            "source_stage15h_run_id=$SOURCE_STAGE15H_RUN_ID" \
            "source_stage13j_run_id=$SOURCE_STAGE13J_RUN_ID" \
            'workload_or_policy_executed=false' \
            'figure_6_status=not_reproduced' \
            > stage15h-final/stage15i_aggregation_provenance.txt
          find stage15h-final -maxdepth 1 -type f ! -name stage15i_delivery.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > stage15h-final/stage15i_delivery.sha256
      - name: Upload final aggregation-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15i-stage15h-aggregation-only-${{ github.run_id }}
          path: stage15h-final/
          if-no-files-found: error
          retention-days: 14
