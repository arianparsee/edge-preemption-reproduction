name: Stage 13-I four-workload cloud checkpoint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage13i-four-workload-checkpoint.yml

permissions:
  contents: read

concurrency:
  group: stage13i-four-workload-checkpoint-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-pair:
    name: ${{ matrix.workload_seed }} / ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        workload_seed:
          # Quote uint64 seeds so YAML/Actions cannot coerce them to IEEE-754 values.
          - "2074092324964443463"
          - "2218754797665862270"
          - "2997476077322633071"
          - "3782887846963969634"
        policy:
          - knapsack_greedy_retention
          - knapsack_greedy_preemption
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      WORKLOAD_SEED: ${{ matrix.workload_seed }}
      POLICY: ${{ matrix.policy }}

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned runtime dependencies
        run: python -m pip install -e .

      - name: Run one isolated policy/workload pair
        shell: bash
        run: |
          start_ns=$(date +%s%N)
          python scripts/run_stage13f_pipe_normal.py \
            --config configs/experiments/pipe_normal_full_stage13f.json \
            --workload-seed "$WORKLOAD_SEED" \
            --policy "$POLICY"
          end_ns=$(date +%s%N)
          python - "$start_ns" "$end_ns" "$WORKLOAD_SEED" "$POLICY" <<'PY'
          import sys
          from pathlib import Path

          start_ns = int(sys.argv[1])
          end_ns = int(sys.argv[2])
          workload_seed = int(sys.argv[3])
          policy = sys.argv[4]
          if end_ns <= start_ns:
              raise ValueError("non-positive measured duration")
          seconds = (end_ns - start_ns) / 1_000_000_000
          Path(f"timing-{workload_seed}-{policy}.txt").write_text(
              f"{seconds:.9f}\n", encoding="utf-8"
          )
          PY

      - name: Validate isolated pair files
        shell: bash
        run: |
          pair_dir="results/raw/stage13f/PIPE-NORMAL/seed-${WORKLOAD_SEED}/${POLICY}"
          test -f "$pair_dir/result.json"
          test -f "$pair_dir/workload.json"
          test -f "$pair_dir/manifest.json"
          test -s "timing-${WORKLOAD_SEED}-${POLICY}.txt"

      - name: Upload isolated pair artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13i-pair-${{ matrix.workload_seed }}-${{ matrix.policy }}-${{ github.run_id }}
          path: |
            results/raw/stage13f/PIPE-NORMAL/seed-${{ env.WORKLOAD_SEED }}/${{ env.POLICY }}/
            timing-${{ env.WORKLOAD_SEED }}-${{ env.POLICY }}.txt
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Verify all sixteen pairs and summarize checkpoint
    needs: run-pair
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned runtime dependencies
        run: python -m pip install -e .

      - name: Download all sixteen isolated pair artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage13i-pair-*-${{ github.run_id }}
          path: ${{ runner.temp }}/combined
          merge-multiple: true

      - name: Verify and record checkpoint
        shell: bash
        run: |
          root="$RUNNER_TEMP/combined"
          python scripts/record_stage13i_cloud_checkpoint.py \
            --root "$root" \
            --config configs/experiments/pipe_normal_full_stage13f.json \
            --output "$root/stage13i_cloud_checkpoint.json"

      - name: Write checkpoint summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "combined"
          payload = json.loads(
              (root / "stage13i_cloud_checkpoint.json").read_text(encoding="utf-8")
          )
          timing = payload["timing_diagnostics"]
          lines = [
              "## Stage 13-I four-workload checkpoint",
              "",
              "- Checkpoint workloads: **4**",
              "- Checkpoint pairs: **16**",
              "- Cumulative workloads including Stage 13-H: **5 of 30**",
              "- Full 30-repeat run: **not completed**",
              "- Scientific aggregation: **not performed**",
              "- Figure 6 reproduced: **no**",
              f"- Mean per-workload parallel wall time: "
              f"**{timing['parallel_policy_wall_seconds_mean'] / 60:.2f} min**",
              f"- Checkpoint artifact bytes: **{payload['total_checkpoint_artifact_bytes']}**",
              "",
              "| Workload seed | Tasks | Parallel wall min |",
              "|---:|---:|---:|",
          ]
          for row in payload["workloads"]:
              lines.append(
                  f"| {row['workload_seed']} | {row['task_count']} | "
                  f"{row['parallel_policy_wall_seconds'] / 60:.2f} |"
              )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload verified checkpoint summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13i-cloud-checkpoint-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/combined/stage13i_cloud_checkpoint.json
          if-no-files-found: error
          retention-days: 14
