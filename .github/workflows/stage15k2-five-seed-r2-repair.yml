name: Stage 15-K.2 five-seed R2-only repair validation

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage15k2-five-seed-r2-repair
  cancel-in-progress: false

jobs:
  pair:
    name: ${{ matrix.workload_seed }} / ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        workload_seed:
          - 2074092324964443463
          - 2218754797665862270
          - 2997476077322633071
          - 3782887846963969634
        policy:
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -e .[dev]
      - name: Run two exact replays; baseline and seed one are not executed
        run: >-
          python scripts/run_stage15k2_pair.py
          --config configs/experiments/pipe_normal_full_stage13f.json
          --baselines tests/fixtures/stage15e_reused_baselines.json
          --prior-repairs tests/fixtures/stage15k2_prior_initialization_reuse.json
          --workload-seed "${{ matrix.workload_seed }}"
          --policy "${{ matrix.policy }}"
          --output "stage15k2-${{ matrix.workload_seed }}-${{ matrix.policy }}.json"
      - name: Validate scientific and public-artifact gates
        run: >-
          python scripts/validate_stage15k2_pair.py
          "stage15k2-${{ matrix.workload_seed }}-${{ matrix.policy }}.json"
          --report "stage15k2-${{ matrix.workload_seed }}-${{ matrix.policy }}-validation.json"
      - name: Record checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          seed = "${{ matrix.workload_seed }}"
          policy = "${{ matrix.policy }}"
          files = sorted(Path(".").glob(f"stage15k2-{seed}-{policy}*.json"))
          payload = {"schema_version": "stage15k2-pair-checksum-v1", "files": [
              {"name": p.name, "bytes": p.stat().st_size,
               "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in files
          ]}
          Path(f"stage15k2-{seed}-{policy}-checksum.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload independent sanitized logical pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15k2-${{ matrix.workload_seed }}-${{ matrix.policy }}-${{ github.run_id }}
          path: stage15k2-${{ matrix.workload_seed }}-${{ matrix.policy }}*.json
          if-no-files-found: error
          retention-days: 14

  finalize:
    if: always()
    needs: pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download all successful new pair artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15k2-*-${{ github.run_id }}
          path: inputs/new
      - name: Reuse the two validated seed-one Stage 15-K.1 artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15k1-*-33663692202
          path: inputs/reused-seed-one
          repository: arianparsee/edge-preemption-reproduction
          run-id: 33663692202
          github-token: ${{ github.token }}
      - name: Validate 10/10 logical pairs and aggregate
        run: >-
          python scripts/finalize_stage15k2.py
          --input-dir inputs
          --output stage15k2-summary.json
          --per-seed-csv stage15k2-paired-by-seed.csv
          --aggregate-csv stage15k2-aggregate.csv
          --report stage15k2-report.md
      - name: Build final checksum manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          names = ["stage15k2-summary.json", "stage15k2-paired-by-seed.csv",
                   "stage15k2-aggregate.csv", "stage15k2-report.md"]
          payload = {"schema_version": "stage15k2-final-checksum-v1", "files": [
              {"name": name, "bytes": Path(name).stat().st_size,
               "sha256": hashlib.sha256(Path(name).read_bytes()).hexdigest()}
              for name in names]}
          Path("stage15k2-checksum-manifest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload sanitized final report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15k2-final-${{ github.run_id }}
          path: |
            stage15k2-summary.json
            stage15k2-paired-by-seed.csv
            stage15k2-aggregate.csv
            stage15k2-report.md
            stage15k2-checksum-manifest.json
          if-no-files-found: error
          retention-days: 14
