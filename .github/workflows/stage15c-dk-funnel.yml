name: Stage 15-C non-interventional DK funnel

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/stage15c-dispatch

permissions:
  contents: read

concurrency:
  group: stage15c-dk-funnel
  cancel-in-progress: false

jobs:
  instrument-dk-funnel:
    name: ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        policy:
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      WORKLOAD_SEED: "541501192080118187"

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -e .[dev]

      - name: Verify selector and auction non-intervention contracts
        run: >-
          python -m pytest -q
          tests/unit/test_stage15b_ga_instrumentation.py
          tests/unit/test_stage15c_dk_funnel.py

      - name: Run instrumented funnel and compare validated baseline fingerprint
        shell: bash
        run: >-
          python scripts/run_stage15c_dk_funnel.py
          --config configs/experiments/pipe_normal_full_stage13f.json
          --baseline tests/fixtures/stage15b_baseline_fingerprints.json
          --policy "${{ matrix.policy }}"
          --output "stage15c-${{ matrix.policy }}.json"

      - name: Reject sensitive or detailed diagnostic fields
        shell: bash
        run: |
          python - "stage15c-${{ matrix.policy }}.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          encoded = path.read_text(encoding="utf-8").lower()
          forbidden = (
              "job-", "arrival_raw_draws", "workload.json", "result.json",
              str(Path.home()).lower(), str(Path.cwd()).lower(),
              "github_token", "secret", ".env", "chromosome_bits\": true",
              "task_identifiers_in_artifact\": true",
          )
          if any(token in encoded for token in forbidden):
              raise ValueError("diagnostic contains a forbidden public field")
          if not data["scientific_fingerprint_equal"]:
              raise ValueError("scientific fingerprint mismatch")
          if data["baseline_recomputed"]:
              raise ValueError("baseline must not be recomputed")
          if data["workload_seed"] != int(541501192080118187):
              raise ValueError("unexpected workload seed")
          if path.stat().st_size > 100_000:
              raise ValueError("diagnostic artifact unexpectedly large")
          PY

      - name: Upload sanitized policy funnel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15c-${{ matrix.policy }}-${{ github.run_id }}
          path: stage15c-${{ matrix.policy }}.json
          if-no-files-found: error
          retention-days: 7

  summarize:
    name: Merge sanitized DK funnel diagnostics
    needs: instrument-dk-funnel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download sanitized policy funnels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15c-*-${{ github.run_id }}
          path: stage15c-input
          merge-multiple: true

      - name: Merge diagnostics and record checksum
        shell: bash
        run: |
          python scripts/merge_stage15c_diagnostics.py \
            --input stage15c-input/stage15c-pipeline_double_knapsack_retention.json \
            --input stage15c-input/stage15c-pipeline_double_knapsack_preemption.json \
            --output stage15c-summary.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("stage15c-summary.json")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path("stage15c-inventory.json").write_text(
              json.dumps({
                  "schema_version": "stage15c-artifact-inventory-v1",
                  "files": [{
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": digest,
                  }],
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Write non-sensitive job summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("stage15c-summary.json").read_text(encoding="utf-8"))
          lines = [
              "## Stage 15-C auxiliary DK funnel",
              "",
              "- Scientific fingerprint equality: **passed**",
              "- Baseline recomputed: **no**",
              "- Raw trace or chromosome bits uploaded: **no**",
              "",
              "| Policy | R1 raw | R1 post-repair | R2 raw | R2 post-repair | Accepted | Rejected |",
              "|---|---:|---:|---:|---:|---:|---:|",
          ]
          for policy, payload in report["policies"].items():
              totals = payload["auction_funnel"]["totals"]
              lines.append(
                  f"| {policy} | {totals['round_1_raw_best_selected_entries']} | "
                  f"{totals['round_1_postrepair_selected_entries']} | "
                  f"{totals['round_2_raw_best_selected_entries']} | "
                  f"{totals['round_2_postrepair_selected_entries']} | "
                  f"{totals['round_2_accepted']} | {totals['round_2_rejected']} |"
              )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload merged limited-retention funnel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15c-merged-diagnostic-${{ github.run_id }}
          path: |
            stage15c-summary.json
            stage15c-inventory.json
          if-no-files-found: error
          retention-days: 7
