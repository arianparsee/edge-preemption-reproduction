name: Stage 15-B non-interventional GA diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/stage15b-dispatch

permissions:
  contents: read

concurrency:
  group: stage15b-ga-diagnostic
  cancel-in-progress: false

jobs:
  instrument-dk:
    name: ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        policy:
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      WORKLOAD_SEED: "541501192080118187"

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -e .[dev]

      - name: Verify non-interventional RNG contract
        run: python -m pytest -q tests/unit/test_stage15b_ga_instrumentation.py

      - name: Run instrumented policy and compare validated baseline fingerprint
        shell: bash
        run: >-
          python scripts/run_stage15b_ga_diagnostic.py
          --config configs/experiments/pipe_normal_full_stage13f.json
          --baseline tests/fixtures/stage15b_baseline_fingerprints.json
          --policy "${{ matrix.policy }}"
          --output "stage15b-${{ matrix.policy }}.json"

      - name: Reject sensitive or detailed diagnostic fields
        shell: bash
        run: |
          python - "stage15b-${{ matrix.policy }}.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          encoded = path.read_text(encoding="utf-8").lower()
          forbidden = (
              "job-", "arrival_raw_draws", "workload.json", "result.json",
              str(Path.home()).lower(), str(Path.cwd()).lower(),
              "github_token", "secret", ".env",
          )
          if any(token in encoded for token in forbidden):
              raise ValueError("diagnostic contains a forbidden public field")
          if not data["scientific_fingerprint_equal"]:
              raise ValueError("scientific fingerprint mismatch")
          if data["workload_seed"] != int(541501192080118187):
              raise ValueError("unexpected workload seed")
          if path.stat().st_size > 100_000:
              raise ValueError("diagnostic artifact unexpectedly large")
          PY

      - name: Upload sanitized policy diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15b-${{ matrix.policy }}-${{ github.run_id }}
          path: stage15b-${{ matrix.policy }}.json
          if-no-files-found: error
          retention-days: 7

  summarize:
    name: Merge sanitized Round-1/Round-2 diagnostics
    needs: instrument-dk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download sanitized policy diagnostics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15b-*-${{ github.run_id }}
          path: stage15b-input
          merge-multiple: true

      - name: Merge diagnostics and record checksum
        shell: bash
        run: |
          python scripts/merge_stage15b_diagnostics.py \
            --input stage15b-input/stage15b-pipeline_double_knapsack_retention.json \
            --input stage15b-input/stage15b-pipeline_double_knapsack_preemption.json \
            --output stage15b-summary.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("stage15b-summary.json")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          Path("stage15b-inventory.json").write_text(
              json.dumps({
                  "schema_version": "stage15b-artifact-inventory-v1",
                  "files": [{
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": digest,
                  }],
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Write non-sensitive job summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("stage15b-summary.json").read_text(encoding="utf-8"))
          lines = [
              "## Stage 15-B auxiliary GA diagnostic",
              "",
              "- Scientific fingerprint equality: **passed**",
              "- Baseline recomputed: **no**",
              "- Workload seed: `541501192080118187`",
              "- Raw trace uploaded: **no**",
              "",
              "| Policy | Round | Calls | GA calls | Candidates | Selected | Repairs |",
              "|---|---|---:|---:|---:|---:|---:|",
          ]
          for policy, policy_data in report["policies"].items():
              for round_name in ("round_1", "round_2"):
                  row = policy_data[round_name]
                  lines.append(
                      f"| {policy} | {round_name} | {row['selector_calls']} | "
                      f"{row['ga_calls']} | {row['candidate_entries']} | "
                      f"{row['selected_entries']} | {row['repair_count']} |"
                  )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload merged limited-retention diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15b-merged-diagnostic-${{ github.run_id }}
          path: |
            stage15b-summary.json
            stage15b-inventory.json
          if-no-files-found: error
          retention-days: 7
