name: Stage 15-K.2-R.1 aggregation-only recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage15k2r1-aggregation-only
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audited aggregation sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download eight immutable Stage 15-K.2-R pair artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15k2-*-33688857517
          path: inputs/run-33688857517
          repository: arianparsee/edge-preemption-reproduction
          run-id: 33688857517
          github-token: ${{ github.token }}
      - name: Download two immutable Stage 15-K.1 seed-one artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15k1-*-33663692202
          path: inputs/run-33663692202
          repository: arianparsee/edge-preemption-reproduction
          run-id: 33663692202
          github-token: ${{ github.token }}
      - name: Validate checksums, identity, replay, RNG, invariants, and config provenance
        run: >-
          python scripts/validate_stage15k2r1_inputs.py
          --input-dir inputs
          --config configs/experiments/pipe_normal_full_stage13f.json
          --report stage15k2r1-input-validation.json
      - name: Aggregate only; do not execute any workload, policy, baseline, or replay
        run: >-
          python scripts/finalize_stage15k2.py
          --input-dir inputs
          --output stage15k2r1-summary.json
          --per-seed-csv stage15k2r1-paired-by-seed.csv
          --aggregate-csv stage15k2r1-aggregate.csv
          --report stage15k2r1-report.md
      - name: Build final SHA-256 manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          names = [
              "stage15k2r1-input-validation.json",
              "stage15k2r1-summary.json",
              "stage15k2r1-paired-by-seed.csv",
              "stage15k2r1-aggregate.csv",
              "stage15k2r1-report.md",
          ]
          payload = {
              "schema_version": "stage15k2r1-final-checksum-v1",
              "aggregation_only": True,
              "scientific_executions": 0,
              "files": [
                  {
                      "name": name,
                      "bytes": Path(name).stat().st_size,
                      "sha256": hashlib.sha256(Path(name).read_bytes()).hexdigest(),
                  }
                  for name in names
              ],
          }
          Path("stage15k2r1-checksum-manifest.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload sanitized aggregation-only report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15k2r1-aggregation-only-${{ github.run_id }}
          path: |
            stage15k2r1-input-validation.json
            stage15k2r1-summary.json
            stage15k2r1-paired-by-seed.csv
            stage15k2r1-aggregate.csv
            stage15k2r1-report.md
            stage15k2r1-checksum-manifest.json
          if-no-files-found: error
          retention-days: 14
