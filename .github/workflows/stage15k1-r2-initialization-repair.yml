name: Stage 15-K.1 R2-only initialization repair pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage15k1-r2-initialization-repair
  cancel-in-progress: false

jobs:
  pilot-pair:
    name: ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        policy:
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -e .[dev]

      - name: Verify Stage 15-K.1 contracts without a formal workload
        run: >-
          python -m pytest -q
          tests/unit/test_stage15k1_selector.py
          tests/unit/test_stage15k1_runner.py
          tests/unit/test_stage15k1_workflow_security.py
          tests/integration/test_stage15d_counterfactual_policies.py

      - name: Run two exact replays of one approved logical pair
        run: >-
          python scripts/run_stage15k1_pilot.py
          --config configs/experiments/pipe_normal_full_stage13f.json
          --baselines tests/fixtures/stage15e_reused_baselines.json
          --baseline-diagnostics tests/fixtures/stage15k1_baseline_diagnostics.json
          --prior-repairs tests/fixtures/stage15e_seed_one_reuse.json
          --policy "${{ matrix.policy }}"
          --output "stage15k1-${{ matrix.policy }}.json"

      - name: Validate sanitization and scientific gates
        run: >-
          python scripts/validate_stage15k1_public_pair.py
          "stage15k1-${{ matrix.policy }}.json"
          --report "stage15k1-${{ matrix.policy }}-validation.json"

      - name: Record pair checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          policy = "${{ matrix.policy }}"
          files = [
              Path(f"stage15k1-{policy}.json"),
              Path(f"stage15k1-{policy}-validation.json"),
          ]
          manifest = {
              "schema_version": "stage15k1-pair-checksum-v1",
              "policy": policy,
              "files": [
                  {
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in files
              ],
          }
          Path(f"stage15k1-{policy}-checksum.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload independent sanitized logical pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15k1-${{ matrix.policy }}-${{ github.run_id }}
          path: |
            stage15k1-${{ matrix.policy }}.json
            stage15k1-${{ matrix.policy }}-validation.json
            stage15k1-${{ matrix.policy }}-checksum.json
          if-no-files-found: error
          retention-days: 14
