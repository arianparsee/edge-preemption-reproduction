name: Stage 15-H 30-workload DK repair validation

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Optional prior Stage 15-H run ID; only valid missing pairs are rerun"
        required: false
        type: string
      confirmation:
        description: "Type STAGE15H-AUXILIARY-APPROVED"
        required: true
        default: "STAGE15H-AUXILIARY-APPROVED"
        type: string
  push:
    branches: [main]
    paths: [.github/stage15h-dispatch]

permissions:
  contents: read
  actions: read

concurrency:
  group: stage15h-thirty-workload-repairs
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ inputs.resume_run_id != '32474360245' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      new_pair_count: ${{ steps.matrix.outputs.new_pair_count }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Enforce explicit dispatch gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "STAGE15H-AUXILIARY-APPROVED"
          else
            test "$(cat .github/stage15h-dispatch)" = "stage15h-30-workload-two-repair-validation-approved-2026-08-15"
          fi
      - name: Install pinned project dependencies
        run: python -m pip install -e .[dev]
      - name: Download pinned validated 20-pair reuse bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_github_run_artifacts.py
          --repository arianparsee/edge-preemption-reproduction
          --run-id 31847136180
          --exact-name stage15h-validated-reuse-31847136180
          --expected-archive-sha256 302b6b88083d51c84bd14abbf7415466b91b81f48bd32d120f19188080a4bc8b
          --output prior-download/consolidated
          --report reusable-bundle/stage15h_source_reuse_download_report.json
      - name: Download valid pairs from an optional prior Stage 15-H run
        if: ${{ inputs.resume_run_id != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_github_run_artifacts.py
          --repository arianparsee/edge-preemption-reproduction
          --run-id "${{ inputs.resume_run_id }}"
          --name-prefix stage15h-pair-
          --name-suffix "-${{ inputs.resume_run_id }}"
          --allow-empty
          --output resume-download
          --report reusable-bundle/stage15h_resume_download_report.json
      - name: Validate and pin all 20 reused repair pairs
        run: >-
          python scripts/verify_stage15h_reuse.py
          --repair-manifest configs/experiments/stage15h_repair_reuse_manifest.json
          --repair-root prior-download/consolidated/stage15h-validated-reuse-31847136180/prior
          --copy-repairs-to reusable-bundle/prior
          --output reusable-bundle/stage15h_prior_reuse_validation.json
      - name: Build resume-safe 100-pair matrix
        id: matrix
        shell: bash
        run: |
          args=(--config configs/experiments/pipe_normal_full_stage13f.json --copy-to reusable-bundle/resumed --output stage15h-matrix.json)
          if [ -d resume-download ]; then args+=(--resume-root resume-download); fi
          python scripts/prepare_stage15h_matrix.py "${args[@]}"
          echo "matrix=$(cat stage15h-matrix.json)" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("new_pair_count=" + str(len(json.load(open("stage15h-matrix.json"))["include"])))
          PY
      - name: Upload validated reuse bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15h-validated-reuse-${{ github.run_id }}
          path: reusable-bundle/
          if-no-files-found: error
          retention-days: 14

  repair-pair:
    if: ${{ inputs.resume_run_id != '32474360245' }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
    name: ${{ matrix.workload_seed }} / ${{ matrix.variant }} / ${{ matrix.policy }}
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project dependencies
        run: python -m pip install -e .[dev]
      - name: Download the pinned reused Stage 13-J baseline pair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_github_run_artifacts.py
          --repository arianparsee/edge-preemption-reproduction
          --run-id 31644121025
          --exact-name "stage13j-batch-${{ matrix.batch_id }}-pair-${{ matrix.workload_seed }}-${{ matrix.policy }}-31644121025"
          --output baseline-input
          --report baseline-download-report.json
      - name: Execute two exact auxiliary replays
        shell: bash
        run: |
          mapfile -t baseline_results < <(find baseline-input -type f -name result.json -print)
          test "${#baseline_results[@]}" -eq 1
          python scripts/run_stage15h_counterfactual.py \
            --config configs/experiments/pipe_normal_full_stage13f.json \
            --baseline-result "${baseline_results[0]}" \
            --workload-seed "${{ matrix.workload_seed }}" \
            --policy "${{ matrix.policy }}" \
            --variant "${{ matrix.variant }}" \
            --output "stage15h-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json"
      - name: Validate sanitized scientific artifact
        run: >-
          python scripts/validate_stage15h_public_pair.py
          "stage15h-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json"
          --report "validation-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json"
      - name: Record pair checksum
        shell: bash
        run: >-
          sha256sum
          "stage15h-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json"
          "validation-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json"
          > "checksum-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.sha256"
      - name: Upload independent sanitized pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15h-pair-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}-${{ github.run_id }}
          path: |
            stage15h-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json
            validation-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json
            checksum-${{ matrix.workload_seed }}-${{ matrix.variant }}-${{ matrix.policy }}.sha256
            baseline-download-report.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: ${{ always() && inputs.resume_run_id != '32474360245' }}
    needs: [prepare, repair-pair]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned project dependencies
        run: python -m pip install -e .[dev]
      - name: Download all successful current-run repair pairs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_github_run_artifacts.py
          --repository arianparsee/edge-preemption-reproduction
          --run-id "${{ github.run_id }}"
          --name-prefix stage15h-pair-
          --name-suffix "-${{ github.run_id }}"
          --allow-empty
          --output current-pairs
          --report current-pairs-download-report.json
      - name: Download validated prior/resume bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15h-validated-reuse-${{ github.run_id }}
          path: reuse-bundle
          merge-multiple: true
      - name: Download pinned Stage 13-J aggregate baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: arianparsee/edge-preemption-reproduction
          run-id: "31644121025"
          pattern: stage13j-final-120-pair-figure6-31644121025
          path: baseline-aggregate
      - name: Resolve the exact downloaded baseline metrics file
        id: baseline_metrics
        shell: bash
        run: |
          mapfile -t metrics < <(find baseline-aggregate -type f -name raw_run_metrics.csv -print)
          test "${#metrics[@]}" -eq 1
          echo "path=${metrics[0]}" >> "$GITHUB_OUTPUT"
      - name: Assemble current and resumed pairs without overwriting
        shell: bash
        run: |
          mkdir -p combined-new
          if [ -d current-pairs ]; then find current-pairs -type f -name 'stage15h-*.json' -exec cp -n {} combined-new/ \;; fi
          if [ -d reuse-bundle/resumed ]; then find reuse-bundle/resumed -type f -name 'stage15h-*.json' -exec cp -n {} combined-new/ \;; fi
      - name: Validate 120 repair pairs and aggregate 30 paired workloads
        run: >-
          python scripts/finalize_stage15h_validation.py
          --new-root combined-new
          --prior-root reuse-bundle/prior
          --repair-manifest configs/experiments/stage15h_repair_reuse_manifest.json
          --baseline-manifest configs/experiments/stage15h_baseline_reuse_manifest.json
          --baseline-metrics "${{ steps.baseline_metrics.outputs.path }}"
          --baseline-lifecycle results/aggregated/stage15a/per_run_lifecycle.csv
          --output stage15h-final
      - name: Preserve paginated-download audit
        if: always()
        shell: bash
        run: |
          mkdir -p stage15h-final
          cp current-pairs-download-report.json stage15h-final/current-pairs-download-report.json
      - name: Upload final validated auxiliary report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15h-final-30-workload-report-${{ github.run_id }}
          path: stage15h-final/
          if-no-files-found: warn
          retention-days: 14

  aggregate-only:
    if: ${{ inputs.resume_run_id == '32474360245' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      SOURCE_STAGE15H_RUN_ID: "32474360245"
      SOURCE_STAGE13J_RUN_ID: "31644121025"
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Enforce fixed aggregation-only recovery gate
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          test "$CONFIRMATION" = "STAGE15H-AUXILIARY-APPROVED"
          test "$RESUME_RUN_ID" = "$SOURCE_STAGE15H_RUN_ID"
      - name: Install pinned project dependencies
        run: python -m pip install -e .[dev]
      - name: Download all 100 successful Stage 15-H pair artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_github_run_artifacts.py
          --repository arianparsee/edge-preemption-reproduction
          --run-id "$SOURCE_STAGE15H_RUN_ID"
          --name-prefix stage15h-pair-
          --name-suffix "-$SOURCE_STAGE15H_RUN_ID"
          --output current-pairs
          --report current-pairs-download-report.json
      - name: Download the validated 20-pair reuse bundle
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/download_github_run_artifacts.py
          --repository arianparsee/edge-preemption-reproduction
          --run-id "$SOURCE_STAGE15H_RUN_ID"
          --exact-name "stage15h-validated-reuse-$SOURCE_STAGE15H_RUN_ID"
          --expected-archive-sha256 4c84c1a479f5fdc6d89c4c573e9a6d690d299cec5d473771bb9ab9a9af6bd4b6
          --output reuse-bundle
          --report reuse-bundle-download-report.json
      - name: Download pinned Stage 13-J aggregate baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: arianparsee/edge-preemption-reproduction
          run-id: "31644121025"
          pattern: stage13j-final-120-pair-figure6-31644121025
          path: baseline-aggregate
      - name: Resolve the exact downloaded baseline metrics file
        id: recovery_baseline_metrics
        shell: bash
        run: |
          mapfile -t metrics < <(find baseline-aggregate -type f -name raw_run_metrics.csv -print)
          test "${#metrics[@]}" -eq 1
          echo "path=${metrics[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify aggregation-only input cardinality
        shell: bash
        run: |
          test "$(find current-pairs -type f -name 'stage15h-*.json' | wc -l)" -eq 100
          test "$(find "reuse-bundle/stage15h-validated-reuse-$SOURCE_STAGE15H_RUN_ID/prior" -type f -name 'reuse-*.json' | wc -l)" -eq 20
      - name: Validate and aggregate existing results only
        run: >-
          python scripts/finalize_stage15h_validation.py
          --new-root current-pairs
          --prior-root "reuse-bundle/stage15h-validated-reuse-$SOURCE_STAGE15H_RUN_ID/prior"
          --repair-manifest configs/experiments/stage15h_repair_reuse_manifest.json
          --baseline-manifest configs/experiments/stage15h_baseline_reuse_manifest.json
          --baseline-metrics "${{ steps.recovery_baseline_metrics.outputs.path }}"
          --baseline-lifecycle results/aggregated/stage15a/per_run_lifecycle.csv
          --output stage15h-final
      - name: Validate final completeness and preserve download audits
        shell: bash
        run: |
          python -c "import json; p=json.load(open('stage15h-final/completeness_report.json')); assert p['status']=='complete_and_valid' and p['repair_pairs']==120 and p['baseline_pairs']==120 and p['baseline_recomputed'] is False"
          cp current-pairs-download-report.json stage15h-final/
          cp reuse-bundle-download-report.json stage15h-final/
          printf '%s\n' \
            'classification=[آزمون کمکی]' \
            "source_stage15h_run_id=$SOURCE_STAGE15H_RUN_ID" \
            "source_stage13j_run_id=$SOURCE_STAGE13J_RUN_ID" \
            'workload_or_policy_executed=false' \
            'figure_6_status=not_reproduced' \
            > stage15h-final/stage15i_aggregation_provenance.txt
          find stage15h-final -maxdepth 1 -type f ! -name stage15i_delivery.sha256 -print0 \
            | sort -z | xargs -0 sha256sum > stage15h-final/stage15i_delivery.sha256
      - name: Upload final aggregation-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15i-stage15h-aggregation-only-${{ github.run_id }}
          path: stage15h-final/
          if-no-files-found: error
          retention-days: 14
