name: Stage 13-J reusable five-workload batch

on:
  workflow_call:
    inputs:
      batch:
        required: true
        type: number
    outputs:
      continue_allowed:
        description: True for a valid batch or only allow-listed transient gaps
        value: ${{ jobs.validate.outputs.continue_allowed }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seeds: ${{ steps.materialize.outputs.seeds }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: materialize
        env:
          BATCH: ${{ inputs.batch }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          batch = int(os.environ["BATCH"])
          plan = json.loads(Path("configs/experiments/stage13j_five_batch_plan.json").read_text())
          item = next(value for value in plan["batches"] if value["batch"] == batch)
          seeds = [str(value) for value in item["workload_seeds"]]
          if len(seeds) != 5 or len(set(seeds)) != 5:
              raise ValueError("batch must contain five distinct seeds")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write(f"seeds={json.dumps(seeds, separators=(',', ':'))}\n")
          PY

  run-pair:
    name: batch-${{ inputs.batch }} / ${{ matrix.workload_seed }} / ${{ matrix.policy }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        workload_seed: ${{ fromJSON(needs.prepare.outputs.seeds) }}
        policy:
          - knapsack_greedy_retention
          - knapsack_greedy_preemption
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      WORKLOAD_SEED: ${{ matrix.workload_seed }}
      POLICY: ${{ matrix.policy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with one allow-listed technical retry
        shell: bash
        run: |
          set +e
          python scripts/run_with_transient_retry.py \
            --metadata "install-retry-${WORKLOAD_SEED}-${POLICY}.json" -- \
            python -m pip install -e .
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            cp "install-retry-${WORKLOAD_SEED}-${POLICY}.json" \
              "technical-failure-${WORKLOAD_SEED}-${POLICY}.json"
            exit 75
          fi
          exit "$code"
      - name: Run isolated pair with scientific fail-fast
        if: hashFiles('technical-failure-*.json') == ''
        shell: bash
        run: |
          start_ns=$(date +%s%N)
          set +e
          python scripts/run_with_transient_retry.py \
            --metadata "retry-${WORKLOAD_SEED}-${POLICY}.json" -- \
            python scripts/run_stage13f_pipe_normal.py \
            --config configs/experiments/pipe_normal_full_stage13f.json \
            --workload-seed "$WORKLOAD_SEED" --policy "$POLICY"
          code=$?
          set -e
          if [ "$code" -eq 75 ]; then
            cp "retry-${WORKLOAD_SEED}-${POLICY}.json" \
              "technical-failure-${WORKLOAD_SEED}-${POLICY}.json"
            exit 75
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          end_ns=$(date +%s%N)
          python - "$start_ns" "$end_ns" "$WORKLOAD_SEED" "$POLICY" <<'PY'
          import sys
          from pathlib import Path
          seconds = (int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000
          if seconds <= 0:
              raise ValueError("non-positive measured duration")
          Path(f"timing-{sys.argv[3]}-{sys.argv[4]}.txt").write_text(
              f"{seconds:.9f}\n", encoding="utf-8"
          )
          PY
      - name: Upload successful immutable pair
        if: success() && hashFiles('results/raw/stage13f/PIPE-NORMAL/**/result.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13j-batch-${{ inputs.batch }}-pair-${{ matrix.workload_seed }}-${{ matrix.policy }}-${{ github.run_id }}
          path: |
            results/raw/stage13f/PIPE-NORMAL/seed-${{ env.WORKLOAD_SEED }}/${{ env.POLICY }}/
            timing-${{ env.WORKLOAD_SEED }}-${{ env.POLICY }}.txt
            retry-${{ env.WORKLOAD_SEED }}-${{ env.POLICY }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed-pair diagnostic
        if: failure() || hashFiles('technical-failure-*.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13j-batch-${{ inputs.batch }}-diagnostic-${{ matrix.workload_seed }}-${{ matrix.policy }}-${{ github.run_id }}
          path: |
            install-retry-${{ env.WORKLOAD_SEED }}-${{ env.POLICY }}.json
            retry-${{ env.WORKLOAD_SEED }}-${{ env.POLICY }}.json
            technical-failure-${{ env.WORKLOAD_SEED }}-${{ env.POLICY }}.json
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: batch-${{ inputs.batch }} checksum and scientific validation
    needs: run-pair
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      continue_allowed: ${{ steps.classify.outputs.continue_allowed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Download every successful pair in this batch
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage13j-batch-${{ inputs.batch }}-pair-*-${{ github.run_id }}
          path: ${{ runner.temp }}/batch
          merge-multiple: true
      - name: Download any transient technical diagnostics
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage13j-batch-${{ inputs.batch }}-diagnostic-*-${{ github.run_id }}
          path: ${{ runner.temp }}/batch
          merge-multiple: true
      - name: Write inventory then require all twenty valid pairs
        env:
          BATCH: ${{ inputs.batch }}
        run: >-
          python scripts/validate_stage13j_batch_checkpoint.py
          --root "${{ runner.temp }}/batch"
          --config configs/experiments/pipe_normal_full_stage13f.json
          --batch-plan configs/experiments/stage13j_five_batch_plan.json
          --batch "$BATCH"
          --output "${{ runner.temp }}/stage13j_batch_${BATCH}_validation.json"
          --inventory "${{ runner.temp }}/stage13j_batch_${BATCH}_inventory.csv"
      - name: Expose scientific continuation gate
        id: classify
        if: always()
        env:
          BATCH: ${{ inputs.batch }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = (
              Path(os.environ["RUNNER_TEMP"])
              / f"stage13j_batch_{os.environ['BATCH']}_validation.json"
          )
          status = json.loads(path.read_text())["status"] if path.is_file() else "missing"
          allowed = status in {"validated", "incomplete_transient_technical_failure"}
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as stream:
              stream.write(f"continue_allowed={str(allowed).lower()}\n")
          PY
      - name: Preserve validation and SHA-256 inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13j-batch-${{ inputs.batch }}-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stage13j_batch_${{ inputs.batch }}_validation.json
            ${{ runner.temp }}/stage13j_batch_${{ inputs.batch }}_inventory.csv
          if-no-files-found: warn
          retention-days: 14
