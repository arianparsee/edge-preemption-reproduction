name: Stage 15-D penalty pair recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/stage15d-penalty-recovery-dispatch

permissions:
  contents: read

concurrency:
  group: stage15d-penalty-recovery
  cancel-in-progress: false

jobs:
  penalty-pair:
    name: fixed_penalty / ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        policy:
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
      WORKLOAD_SEED: "541501192080118187"

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -e .[dev]

      - name: Verify fixed-penalty guard and RNG contracts
        run: >-
          python -m pytest -q
          tests/unit/test_stage15d_counterfactual_selector.py
          tests/unit/test_stage15d_runner.py
          tests/integration/test_stage15d_counterfactual_policies.py
          tests/unit/test_stage15d_penalty_recovery_workflow.py

      - name: Run two exact replays of one failed penalty pair only
        shell: bash
        run: >-
          python scripts/run_stage15d_counterfactual.py
          --config configs/experiments/pipe_normal_full_stage13f.json
          --baseline-fingerprints tests/fixtures/stage15b_baseline_fingerprints.json
          --baseline-rng tests/fixtures/stage15d_stage15c_rng_guard.json
          --policy "${{ matrix.policy }}"
          --variant fixed_penalty
          --output "stage15d-fixed_penalty-${{ matrix.policy }}.json"

      - name: Reject sensitive, raw or scientifically invalid output
        shell: bash
        run: |
          python - "stage15d-fixed_penalty-${{ matrix.policy }}.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          encoded = text.lower()
          data = json.loads(text)
          forbidden = (
              "job-", "arrival_raw_draws", "workload.json", "result.json",
              str(Path.home()).lower(), str(Path.cwd()).lower(),
              "github_token", "github_pat_", "secret", ".env",
              "chromosome_bits\": true", "task_identifiers_in_artifact\": true",
              "raw_workload_in_artifact\": true", "raw_trace_in_artifact\": true",
          )
          if any(token in encoded for token in forbidden):
              raise ValueError("penalty recovery artifact contains a forbidden public field")
          if data["variant"] != "fixed_penalty":
              raise ValueError("recovery workflow may run only fixed_penalty")
          if data["baseline_recomputed"] or not data["replay_exact"]:
              raise ValueError("baseline reuse or replay invariant failed")
          if not data["rng_gate"]["passed"]:
              raise ValueError("RNG gate failed")
          if data["workload_seed"] != int(541501192080118187):
              raise ValueError("unexpected workload seed")
          if data["official_algorithm_changed"] or data["figure_6_overwritten"]:
              raise ValueError("official-result boundary failed")
          if data["thirty_workloads_executed"]:
              raise ValueError("Stage 15-D must remain single-seed")
          if path.stat().st_size > 5_000_000:
              raise ValueError("penalty recovery artifact unexpectedly large")
          PY

      - name: Upload independent recovered pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15d-recovered-fixed_penalty-${{ matrix.policy }}-${{ github.run_id }}
          path: stage15d-fixed_penalty-${{ matrix.policy }}.json
          if-no-files-found: error
          retention-days: 7
