name: Stage 15-E limited multi-seed DK counterfactuals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/stage15e-dispatch

permissions:
  contents: read

concurrency:
  group: stage15e-limited-multiseed
  cancel-in-progress: false

jobs:
  counterfactual-pair:
    name: ${{ matrix.seed }} / ${{ matrix.variant }} / ${{ matrix.policy }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed:
          # Strings are required: GitHub's expression layer otherwise serializes
          # these >2^53 identifiers in scientific notation before the runner.
          - "2074092324964443463"
          - "2218754797665862270"
          - "2997476077322633071"
          - "3782887846963969634"
        variant:
          - initial_population_repair
          - offspring_repair
        policy:
          - pipeline_double_knapsack_retention
          - pipeline_double_knapsack_preemption
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -e .[dev]

      - name: Verify Stage 15-E contracts
        run: >-
          python -m pytest -q
          tests/unit/test_stage15e_runner.py
          tests/unit/test_stage15e_merge.py
          tests/unit/test_stage15e_workflow_security.py

      - name: Run two exact replays of one new auxiliary pair
        run: >-
          python scripts/run_stage15e_counterfactual.py
          --config configs/experiments/pipe_normal_full_stage13f.json
          --baselines tests/fixtures/stage15e_reused_baselines.json
          --workload-seed "${{ matrix.seed }}"
          --policy "${{ matrix.policy }}"
          --variant "${{ matrix.variant }}"
          --output "stage15e-${{ matrix.seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json"

      - name: Reject sensitive or scientifically invalid output
        run: >-
          python scripts/validate_stage15e_public_pair.py
          "stage15e-${{ matrix.seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json"

      - name: Upload independent sanitized pair
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15e-${{ matrix.seed }}-${{ matrix.variant }}-${{ matrix.policy }}-${{ github.run_id }}
          path: stage15e-${{ matrix.seed }}-${{ matrix.variant }}-${{ matrix.policy }}.json
          if-no-files-found: error
          retention-days: 7

  summarize:
    name: Validate 16 new and four reused pairs
    if: always()
    needs: counterfactual-pair
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download all successful new pair artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage15e-*-${{ github.run_id }}
          path: stage15e-input
          merge-multiple: true

      - name: Require 16/16 new pairs and merge with reused seed one
        shell: bash
        run: |
          mapfile -t files < <(find stage15e-input -maxdepth 1 -type f -name '*.json' -print | sort)
          if [ "${#files[@]}" -ne 16 ]; then
            echo "Expected 16 independent new pair artifacts; found ${#files[@]}" >&2
            exit 1
          fi
          args=()
          for file in "${files[@]}"; do args+=(--input "$file"); done
          python scripts/merge_stage15e_validation.py \
            "${args[@]}" \
            --seed-one tests/fixtures/stage15e_seed_one_reuse.json \
            --output stage15e-summary.json \
            --per-seed-csv stage15e-per-seed.csv \
            --aggregate-csv stage15e-aggregate.csv

      - name: Record SHA-256 inventory
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          files = [Path("stage15e-summary.json"), Path("stage15e-per-seed.csv"), Path("stage15e-aggregate.csv")]
          inventory = {"schema_version": "stage15e-cloud-inventory-v1", "files": [
              {"name": p.name, "bytes": p.stat().st_size, "sha256": hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in files
          ]}
          Path("stage15e-inventory.json").write_text(json.dumps(inventory, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload merged limited-retention report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15e-merged-five-seed-${{ github.run_id }}
          path: |
            stage15e-summary.json
            stage15e-per-seed.csv
            stage15e-aggregate.csv
            stage15e-inventory.json
          if-no-files-found: error
          retention-days: 7
