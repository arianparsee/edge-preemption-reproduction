name: Stage 15-M.1 proposed no-cascading DK-P pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage15m1-no-cascading-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: One DK-P logical pair, two exact replays
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out audited sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -e .[dev]

      - name: Run fixture-only contracts before scientific execution
        run: >-
          python -m pytest -q
          tests/unit/test_stage15m1_no_cascading.py
          tests/unit/test_stage15m1_contracts.py

      - name: Run the approved logical pair with two exact replays
        run: >-
          python scripts/run_stage15m1_pilot.py
          --config configs/experiments/pipe_normal_full_stage13f.json
          --baseline-fixture tests/fixtures/stage15e_reused_baselines.json
          --repair-fixture tests/fixtures/stage15e_seed_one_reuse.json
          --output stage15m1-pilot.json

      - name: Validate public sanitization and scientific gates
        run: >-
          python scripts/validate_stage15m1_public.py
          stage15m1-pilot.json
          --report stage15m1-validation.json

      - name: Build checksum manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          files = [Path("stage15m1-pilot.json"), Path("stage15m1-validation.json")]
          manifest = {
              "schema_version": "stage15m1-checksum-v1",
              "files": [
                  {
                      "name": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in files
              ],
          }
          Path("stage15m1-checksum.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload sanitized pilot artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage15m1-no-cascading-${{ github.run_id }}
          path: |
            stage15m1-pilot.json
            stage15m1-validation.json
            stage15m1-checksum.json
          if-no-files-found: error
          retention-days: 14
