name: Stage 13-J full 25-workload run

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter RUN-STAGE13J-FULL-25
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/stage13j-full-run-dispatch

permissions:
  contents: read
  actions: read

concurrency:
  group: stage13j-full-25-workload
  cancel-in-progress: false

jobs:
  protect-prior-20:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate explicit full-run authorization
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRMATION" = "RUN-STAGE13J-FULL-25"
          else
            test "$(cat .github/stage13j-full-run-dispatch)" = \
              "RUN-STAGE13J-FULL-25"
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Recover four Stage 13-H cloud pairs without recomputation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: arianparsee/edge-preemption-reproduction
          run-id: 31624982369
          pattern: stage13h-pair-*-31624982369
          path: ${{ runner.temp }}/prior
          merge-multiple: true
      - name: Recover sixteen Stage 13-I cloud pairs without recomputation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          repository: arianparsee/edge-preemption-reproduction
          run-id: 31629941152
          pattern: stage13i-pair-*-31629941152
          path: ${{ runner.temp }}/prior
          merge-multiple: true
      - name: Require 20 of 20 prior cloud pairs and all hashes
        run: >-
          python scripts/verify_stage13j_prior_cloud_pairs.py
          --root "${{ runner.temp }}/prior"
          --config configs/experiments/pipe_normal_full_stage13f.json
          --output "${{ runner.temp }}/prior/stage13j_prior_20_validation.json"
      - name: Preserve validated prior checkpoint in this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13j-prior-20-validated-${{ github.run_id }}
          path: ${{ runner.temp }}/prior/
          if-no-files-found: error
          retention-days: 14

  batch-1:
    needs: protect-prior-20
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/stage13j-five-workload-batch.yml
    with: {batch: 1}
  batch-2:
    needs: batch-1
    if: ${{ always() && needs.batch-1.outputs.continue_allowed == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/stage13j-five-workload-batch.yml
    with: {batch: 2}
  batch-3:
    needs: batch-2
    if: ${{ always() && needs.batch-2.outputs.continue_allowed == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/stage13j-five-workload-batch.yml
    with: {batch: 3}
  batch-4:
    needs: batch-3
    if: ${{ always() && needs.batch-3.outputs.continue_allowed == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/stage13j-five-workload-batch.yml
    with: {batch: 4}
  batch-5:
    needs: batch-4
    if: ${{ always() && needs.batch-4.outputs.continue_allowed == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/stage13j-five-workload-batch.yml
    with: {batch: 5}

  finalize:
    needs: batch-5
    if: ${{ always() && needs.batch-5.outputs.continue_allowed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Download validated prior 20 pairs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage13j-prior-20-validated-${{ github.run_id }}
          path: ${{ runner.temp }}/all
          merge-multiple: true
      - name: Download all 100 newly successful pairs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stage13j-batch-*-pair-*-${{ github.run_id }}
          path: ${{ runner.temp }}/all
          merge-multiple: true
      - name: Validate 120/120, aggregate ASSUMP-033 and create Figure 6
        shell: bash
        run: |
          cp configs/experiments/pipe_normal_full_stage13f.json "$RUNNER_TEMP/all/"
          set +e
          python scripts/finalize_stage13j_full_run.py \
            --root "$RUNNER_TEMP/all" \
            --config "$RUNNER_TEMP/all/pipe_normal_full_stage13f.json" \
            --output "$RUNNER_TEMP/all/results/aggregated/stage13j" \
            --figures "$RUNNER_TEMP/all/figures/stage13j" \
            2>&1 | tee "$RUNNER_TEMP/stage13j-finalizer.log"
          code=${PIPESTATUS[0]}
          set -e
          printf '{"finalizer_exit_code":%s,"required_pairs":120}\n' "$code" \
            > "$RUNNER_TEMP/stage13j-finalizer-status.json"
          exit "$code"
      - name: Publish final CSV, Figure 6, inventory and comparison report
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13j-final-120-pair-figure6-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/all/results/aggregated/stage13j/
            ${{ runner.temp }}/all/figures/stage13j/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve finalizer status even if 120/120 is not reached
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage13j-finalizer-status-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/stage13j-finalizer.log
            ${{ runner.temp }}/stage13j-finalizer-status.json
          if-no-files-found: warn
          retention-days: 14
